services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hubby
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hubby
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - hubby-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hubby -d hubby']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  hubby-data:
